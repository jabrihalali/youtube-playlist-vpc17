name: Vpc17 Playlist Automation
on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21,23 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          FIXED_VIDEO_ID: ${{ secrets.FIXED_VIDEO_ID }}
          INTRO_VIDEO_ID: ${{ secrets.INTRO_VIDEO_ID }}
